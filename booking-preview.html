<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dinevo · Booking flow preview</title>
<style>
:root{--bg:#080705;--surface:#15130d;--line:#2a251a;--gold:#c9a227;--gold-hi:#f1d68c;--text:#eae6da;--dim:#9a9686}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{max-width:720px;margin:auto;padding:24px 18px 80px}header,.row,nav{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:30px;letter-spacing:-1px}h2{font-size:21px}p{line-height:1.6;color:var(--dim)}a{color:var(--gold-hi)}.notice{border:1px dashed var(--gold);padding:14px;border-radius:16px;font-size:13px;margin:20px 0}.card{border:1px solid var(--line);background:var(--surface);padding:22px;border-radius:24px;margin:16px 0}.row{padding:12px 0;border-bottom:1px solid var(--line)}.row span{color:var(--dim)}button,select,input{font:inherit;border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--surface);color:var(--text)}button{cursor:pointer;min-height:48px}button.primary{background:var(--gold-hi);color:var(--bg);font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}nav button{flex:1}nav button[aria-pressed=true]{border-color:var(--gold);color:var(--gold-hi)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions button{flex:1}.amount{font-size:34px;color:var(--gold-hi)}.success{animation:arrive .6s ease-out;border-color:var(--gold);text-align:center}.tick{display:inline-grid;place-items:center;border:1px solid var(--gold);border-radius:50%;width:60px;height:60px;font-size:30px;color:var(--gold-hi)}label{display:block;margin:12px 0}select{width:100%}.small{font-size:13px}button:focus-visible,a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}@keyframes arrive{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><main><header><a href="index.html">← DINEVO</a><button id="reset">Reset demo</button></header><div class="notice"><b>Interactive demo · ₹100 test credit</b><br>No real money, reservation or restaurant notification. Both tabs below simulate the two sides on this device.</div><nav aria-label="Preview role"><button id="customer" aria-pressed="true">Customer</button><button id="restaurant" aria-pressed="false">Restaurant partner</button></nav><div id="content" aria-live="polite"></div></main>
<script>
const money=n=>'₹'+n.toFixed(2);const reasons=['Plans changed','Date or time does not suit','Discount does not suit','Chose another restaurant','Booked by mistake'];
const fresh=()=>({stage:'offer',balance:100,token:20,bill:1000,discount:20,holdUntil:0,holdUsed:false,reason:'',ack:false,date:new Date(Date.now()+86400000).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}),time:'8:30 PM'});
let booking=fresh(),role='customer',declining=false;
function summary(){return `<div class="row"><span>Restaurant</span><b>Copper &amp; Clove · sample</b></div><div class="row"><span>Date &amp; time</span><b>${booking.date} · ${booking.time}</b></div><div class="row"><span>Guests</span><b>2 adults</b></div><div class="row"><span>Selected approximate bill</span><b>${money(booking.bill)}</b></div><div class="row"><span>Agreed discount</span><b>${booking.discount}% on eligible items</b></div><div class="row"><span>Token ${['paid','reviewed','active'].includes(booking.stage)?'paid (demo)':'due'}</span><b>${money(booking.token)}</b></div>`}
function terms(){return `<p class="small">Under the restaurant’s T&amp;C, cold drinks and other specified items may be excluded from the discount. The discount applies to eligible items; your token is then deducted from the remaining total. Final bill and eligibility are confirmed by the restaurant.</p>`}
function render(){
 if(booking.stage==='hold'&&Date.now()>=booking.holdUntil)booking.stage='expired';
 document.getElementById('customer').setAttribute('aria-pressed',role==='customer');document.getElementById('restaurant').setAttribute('aria-pressed',role==='restaurant');
 let html='';const terminal=['declined','expired'].includes(booking.stage);
 if(role==='customer'){
 html=`<h1>${booking.stage==='active'?'Your table is ready for you':'Review your reservation'}</h1><div class="row"><span>Demo wallet balance</span><b class="amount">${money(booking.balance)}</b></div>`;
 if(terminal)html+=`<div class="card"><h2>${booking.stage==='expired'?'Your hold has expired':'Reservation declined'}</h2><p>${booking.reason||'No token was deducted. Start a fresh request when you are ready.'}</p></div>`;
 else if(['paid','reviewed','active'].includes(booking.stage)){
 html+=`<div class="card ${booking.stage!=='paid'?'success':''}"><span class="tick">✓</span><h2>${booking.stage==='paid'?'Demo token confirmed':booking.stage==='reviewed'?'See you at the table!':'Restaurant acknowledged your token'}</h2><p>Copper &amp; Clove · ${booking.date} · ${booking.time}</p>${summary()}<p>${booking.stage==='paid'?'Review the details below, then select OK.':booking.stage==='reviewed'?'Your demo booking is awaiting the restaurant’s acknowledgement.':'Your demo booking is in Active ongoing orders.'}</p></div>`;
 html+=`<div class="card"><h2>Your bill, explained</h2><div class="row"><span>Illustrative eligible bill</span><b>₹1,000.00</b></div><div class="row"><span>Agreed 20% discount</span><b>− ₹200.00</b></div><div class="row"><span>Token already paid (demo)</span><b>− ₹20.00</b></div><div class="row"><span>Illustrative amount left</span><b>₹780.00</b></div>${terms()}${booking.stage==='paid'?'<button class="primary" id="review">OK · Details are correct</button>':''}</div>`;
 }else{
 html+=`<div class="card"><h2>Restaurant has offered your table</h2>${summary()}${terms()}<p class="small">Token: 2% of your approximate bill, minimum ₹20. This demo uses a ₹1,000 bill.</p>${booking.stage==='hold'?'<p>Hold remaining: <b id="timer"></b></p>':''}<div class="actions"><button class="primary" id="pay">Pay ${money(booking.token)} with demo wallet</button><button id="hold" ${booking.holdUsed?'disabled':''}>Hold for 5 minutes</button><button id="decline">Decline</button></div>${declining?'<label for="reason">Why are you declining?</label><select id="reason"><option value="">Select a reason</option>'+reasons.map(r=>'<option>'+r+'</option>').join('')+'</select><div class="actions"><button id="confirmDecline">Confirm decline</button><button id="keep">Keep reservation</button></div>':''}</div>`;
 }
 }else{
 html='<h1>Restaurant partner</h1>';
 if(terminal)html+=`<div class="card"><h2>${booking.stage==='declined'?'Customer declined':'Hold expired'}</h2><p>${booking.reason||'Release the demo table. No token received.'}</p></div>`;
 else if(booking.stage==='active')html+=`<div class="card success"><span class="tick">✓</span><h2>New booking · See you soon!</h2><p>${booking.date} at ${booking.time} · 2 adults</p></div><h2>Active ongoing orders</h2><div class="card">${summary()}<p>Customer reviewed the booking. Demo token receipt acknowledged.</p>${terms()}</div>`;
 else if(booking.stage==='reviewed')html+=`<div class="card success"><h2>You have a new demo booking</h2>${summary()}<div class="notice">How it works: review the date, guests, agreed discount and token below. Acknowledge receipt to move this booking into Active ongoing orders. In production, receipt must be verified by the server.</div><button class="primary" id="ack">Acknowledge ${money(booking.token)} demo token received</button></div>`;
 else html+=`<div class="card"><h2>${booking.stage==='paid'?'Demo token paid · awaiting customer review':booking.stage==='hold'?'Customer requested a five-minute hold':'Offer sent · awaiting customer'}</h2>${summary()}${booking.stage==='hold'?'<p>Hold remaining: <b id="timer"></b></p>':''}</div><h2>Active ongoing orders</h2><p>No active demo orders yet.</p>`;
 }
 document.getElementById('content').innerHTML=html;
 const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};
 on('pay',()=>{if(!['offer','hold'].includes(booking.stage))return;if(booking.stage==='hold'&&Date.now()>=booking.holdUntil){booking.stage='expired';return render()}if(booking.balance<booking.token)return;booking.balance-=booking.token;booking.stage='paid';declining=false;render()});
 on('hold',()=>{if(booking.holdUsed)return;booking.holdUsed=true;booking.holdUntil=Date.now()+300000;booking.stage='hold';render()});
 on('decline',()=>{declining=true;render()});on('keep',()=>{declining=false;render()});on('confirmDecline',()=>{const reason=document.getElementById('reason').value;if(!reasons.includes(reason))return;booking.reason=reason;booking.stage='declined';render()});on('review',()=>{if(booking.stage!=='paid')return;booking.stage='reviewed';render()});on('ack',()=>{if(booking.stage!=='reviewed')return;booking.stage='active';render()});tick();
}
function tick(){if(booking.stage==='hold'){const remaining=Math.max(0,Math.ceil((booking.holdUntil-Date.now())/1000));if(!remaining){booking.stage='expired';render();return}const t=document.getElementById('timer');if(t)t.textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0')}}
document.getElementById('customer').onclick=()=>{role='customer';render()};document.getElementById('restaurant').onclick=()=>{role='restaurant';render()};document.getElementById('reset').onclick=()=>{booking=fresh();declining=false;render()};setInterval(tick,1000);render();
</script></html>
